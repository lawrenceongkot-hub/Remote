services:
  postgres:
    image: postgres:16-alpine
    container_name: remote-support-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: remote_support
      POSTGRES_PASSWORD: remote_support_dev
      POSTGRES_DB: remote_support
    ports:
      - "5432:5432"
    volumes:
      - remote_support_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remote_support -d remote_support"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  remote_support_pgdata: